# Tests del backend en cada push y pull request. El EC2 solo despliega los commits
# cuyo job «Tests» terminó bien: revisa este resultado cada 5 minutos (ver
# deploy/aws/CI-CD.md). Si cambias el nombre del job, cámbialo también en
# deploy/aws/autodeploy/autodeploy.sh.
name: Backend · tests

on:
  push:
    branches: [feat/explorador-entidades]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # La misma versión que la imagen de producción (Dockerfile).
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        # docling y transformers (con torch) pesan varios GB y los tests no los usan:
        # los módulos que los importan se reemplazan por stubs en los tests.
        run: |
          grep -vE '^(docling|transformers)\b' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest

      - name: Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: python -m pytest -q
